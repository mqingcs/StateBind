[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "statebind"
version = "1.0.0"
description = "StateBind: Exposing the Symbol-to-State Binding Gap in Visual Measurement (MMM 2027)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Qing Mu", email = "qingmu@link.cuhk.edu.cn" },
  { name = "Jiani Zheng", email = "ninajnzheng@tencent.com" },
]
dependencies = [
  "pillow>=10.0.0",
  "reportlab>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/statebind"]
