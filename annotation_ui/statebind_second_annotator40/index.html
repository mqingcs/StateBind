<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StateBind · Independent Geometry Review</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <div class="eyebrow">STATEBIND-200 / INDEPENDENT REVIEW</div>
          <h1>局部状态几何复核</h1>
        </div>
      </div>
      <div class="top-progress" aria-live="polite">
        <div class="progress-copy"><strong id="progressCount">0 / 40</strong><span>已完成</span></div>
        <div class="progress-track"><span id="progressBar"></span></div>
      </div>
    </header>

    <aside class="sidebar">
      <div class="blind-note">
        <span class="blind-dot"></span>
        <div><strong>几何独立复核</strong><p>刻度语义已预填；不显示既有点位、模型建议或答案。</p></div>
      </div>
      <div class="sidebar-heading">
        <span>样本</span>
        <button id="jumpPending" class="text-button" type="button">首个未完成</button>
      </div>
      <nav id="taskList" class="task-list" aria-label="样本列表"></nav>
    </aside>

    <main class="workspace">
      <section class="question-card">
        <div class="sample-index" id="sampleIndex">S2—001</div>
        <h2 id="question">正在载入…</h2>
      </section>

      <section class="canvas-card">
        <div class="toolstrip" role="toolbar" aria-label="标注工具">
          <button class="tool active" data-tool="axis" type="button"><kbd>1</kbd><span>轴线</span><i class="swatch axis"></i></button>
          <button class="tool" data-tool="target" type="button"><kbd>2</kbd><span>真实状态</span><i class="swatch target"></i></button>
          <button class="tool" data-tool="low" type="button"><kbd>3</kbd><span>低值最小刻度</span><i class="swatch low"></i></button>
          <button class="tool" data-tool="high" type="button"><kbd>4</kbd><span>高值最小刻度</span><i class="swatch high"></i></button>
          <span class="tool-divider"></span>
          <button id="undo" class="icon-tool" type="button" title="撤销（Z）">↶</button>
          <button id="clearPoints" class="icon-tool" type="button" title="清空本张">⌫</button>
          <button id="zoomOut" class="icon-tool" type="button" title="缩小">−</button>
          <button id="zoomFit" class="zoom-readout" type="button">适应</button>
          <button id="zoomIn" class="icon-tool" type="button" title="放大">＋</button>
        </div>
        <div id="imageStage" class="image-stage">
          <div class="canvas-wrap"><canvas id="canvas"></canvas></div>
          <div id="loading" class="loading"><span></span>载入原始图像</div>
        </div>
        <div class="canvas-foot">
          <p><strong>标注顺序：</strong>先定轴线，再标真实状态，最后点目标附近相邻的低值与高值最小刻度。</p>
          <p id="toolHint">轴线：沿实际读数方向点击两个相距较远的点。</p>
        </div>
      </section>

      <div class="workspace-nav">
        <button id="previous" type="button">← 上一张</button>
        <span id="autosaveState">尚未保存</span>
        <button id="next" type="button">下一张 →</button>
      </div>
    </main>

    <aside class="inspector">
      <div class="inspector-scroll">
        <section class="step-card">
          <div class="section-label">几何完成度</div>
          <div class="step-grid">
            <span id="stepAxis"><i></i>轴线 2 点</span>
            <span id="stepTarget"><i></i>真实状态 2 点</span>
            <span id="stepLow"><i></i>低值刻度</span>
            <span id="stepHigh"><i></i>高值刻度</span>
          </div>
        </section>

        <section class="form-section">
          <div class="prefill-note"><i></i><span>以下语义字段已从主标注预填；发现错误时可直接修改。</span></div>
          <label for="minorTick">最小刻度差</label>
          <div class="split-row">
            <input id="minorTick" inputmode="decimal" placeholder="例如 0.1">
            <input id="unit" placeholder="单位，如 °C">
          </div>
          <label for="branch">刻度支路</label>
          <input id="branch" placeholder="例如 left Celsius scale">
        </section>

        <section class="form-section">
          <div class="section-label">真实状态规则</div>
          <div class="segmented" id="ruleGroup">
            <button type="button" data-value="absolute_position"><span>位置</span><small>指针或游标中心</small></button>
            <button type="button" data-value="boundary_position"><span>边界</span><small>液面、液柱或活塞边缘</small></button>
            <button type="button" data-value="span_difference"><span>长度</span><small>物体起点与终点</small></button>
          </div>
        </section>

        <section class="form-section">
          <div class="section-label">图像可判定性</div>
          <div class="visibility" id="visibilityGroup">
            <button type="button" data-value="clear"><i></i><span>Clear<small>边界与刻度都清楚</small></span></button>
            <button type="button" data-value="usable"><i></i><span>Usable<small>可判断但存在模糊或遮挡</small></span></button>
            <button type="button" data-value="exclude"><i></i><span>Exclude<small>无法独立可靠标注</small></span></button>
          </div>
          <textarea id="excludeReason" class="conditional" placeholder="Exclude 原因（必填）"></textarea>
        </section>

        <section class="form-section">
          <label for="notes">备注 <span>可选</span></label>
          <textarea id="notes" placeholder="只记录图像本身造成的判断依据或歧义"></textarea>
        </section>
        <div id="error" class="error" role="alert"></div>
      </div>
      <div class="save-dock">
        <button id="save" class="save-button" type="button"><span>确认并自动下一张</span><kbd>⌘↵</kbd></button>
        <button id="deleteAnnotation" class="delete-button" type="button">删除本张已保存结果</button>
      </div>
    </aside>
  </div>
  <script src="/assets/app.js" defer></script>
</body>
</html>
